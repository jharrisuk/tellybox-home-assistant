# Tellybox full panel for Home Assistant 2026.10 or newer.
#
# One custom:button-card panel showing everything the integration exposes:
# status and maintenance, viewers, paused streams, upload against the cap,
# downloads, host uptime, memory and free disk space.
#
# Install the frontend dependency first: HACS > Frontend > button-card >
# Download, then reload the browser. This is a dashboard card, not an
# integration.
#
# Before use:
# 1. Copy the bundled wordmark from
#    custom_components/tellybox/brand/dark_logo.png
#    to <config>/www/tellybox/dark_logo.png. Change `logo` once if you use
#    another path.
# 2. Change `entity_prefix` once if your entity IDs differ. With the default
#    entry title Tellybox (tellybox.local) the prefix is
#    tellybox_tellybox_local, giving IDs such as
#    sensor.tellybox_tellybox_local_active_streams and
#    binary_sensor.tellybox_tellybox_local_online.
# 3. Paste this file into a dashboard with Edit dashboard > Add card > Manual.
#
# Unknown, unavailable or invalid readings render as an em dash, never as
# zero. A real zero still renders 0. A configured cap of 0 shows unlimited.
# Every injected value is escaped before it reaches the markup.

type: custom:button-card
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
hold_action:
  action: none
triggers_update: all
variables:
  entity_prefix: tellybox_tellybox_local
  logo: /local/tellybox/dark_logo.png
custom_fields:
  panel: |
    [[[
      const cfg = (typeof variables === 'object' && variables !== null) ? variables : {};
      const prefix = String(cfg.entity_prefix || 'tellybox_tellybox_local').trim().replace(/^\.+|\.+$/g, '');
      const logo = String(cfg.logo || '/local/tellybox/dark_logo.png');
      const id = (domain, name) => `${domain}.${prefix}_${name}`;
      const S = hass.states;

      const esc = (v) => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const read = (...names) => {
        for (const name of names) {
          const e = S[name];
          if (e && e.state !== 'unavailable' && e.state !== 'unknown') return e;
        }
        return null;
      };
      const state = (...names) => { const e = read(...names); return e ? e.state : '—'; };
      const num = (...names) => { const v = parseFloat(state(...names)); return Number.isFinite(v) ? v : null; };
      const count = (...names) => { const v = num(...names); return v === null ? '—' : Math.round(v).toString(); };
      const attr = (names, key, fallback) => { const e = read(...names); return e?.attributes?.[key] ?? fallback; };

      const fmtDuration = (...names) => {
        const e = read(...names);
        if (!e) return '—';
        const text = String(e.state).trim();
        const value = Number(text);
        if (!Number.isFinite(value) || !/^\d+(\.\d+)?$/.test(text)) return esc(text);
        let seconds = value;
        const unit = String(e.attributes?.unit_of_measurement || '').toLowerCase();
        if (unit === 'ms' || unit.startsWith('millisecond')) seconds /= 1000;
        else if (unit === 'min' || unit.startsWith('minute')) seconds *= 60;
        else if (unit === 'h' || unit.startsWith('hour')) seconds *= 3600;
        else if (unit === 'd' || unit.startsWith('day')) seconds *= 86400;
        else if (unit === 'w' || unit.startsWith('week')) seconds *= 604800;
        const d = Math.floor(seconds / 86400), h = Math.floor((seconds % 86400) / 3600), m = Math.floor((seconds % 3600) / 60);
        return d > 0 ? `${d}d ${h}h` : h > 0 ? `${h}h ${m}m` : `${m}m`;
      };
      const fmtSize = (...names) => {
        const e = read(...names);
        if (!e) return '—';
        const value = parseFloat(e.state);
        if (!Number.isFinite(value)) return esc(e.state);
        const unit = String(e.attributes?.unit_of_measurement || 'GB');
        return unit === 'B' ? (value / 1e9).toFixed(1) + ' GB' : value.toFixed(1) + ' ' + esc(unit);
      };

      /* Status: offline wins over maintenance because a failed poll cannot confirm the flag. */
      const onlineState = state(id('binary_sensor', 'online'));
      const online = onlineState === 'on';
      const offline = onlineState === 'off';
      const maintState = state(id('binary_sensor', 'maintenance_mode'), id('binary_sensor', 'maintenance'));
      const maint = online && maintState === 'on';
      const status = offline ? 'OFFLINE' : maint ? 'MAINTENANCE' : online ? 'ONLINE' : 'UNKNOWN';
      const amber = '#f2c14e';
      const statusColor = offline ? '#ff9b9b' : maint ? amber : online ? '#c7ed89' : amber;
      const statusBg = offline ? 'rgba(255,107,107,.10)' : maint ? 'rgba(242,193,78,.12)' : online ? 'rgba(199,237,137,.10)' : 'rgba(242,193,78,.10)';
      const statusBorder = offline ? 'rgba(255,107,107,.25)' : maint ? 'rgba(242,193,78,.30)' : online ? 'rgba(199,237,137,.26)' : 'rgba(242,193,78,.25)';

      /* Metrics. */
      const active = count(id('sensor', 'active_streams'));
      const viewers = count(id('sensor', 'viewers'));
      const paused = count(id('sensor', 'paused_streams'));
      const connected = count(id('sensor', 'connected_streams'));
      const local = count(id('sensor', 'local_streams'));
      const remote = count(id('sensor', 'remote_streams'));
      const downloads = count(id('sensor', 'active_downloads'));
      const plays = count(id('sensor', 'play_requests_24_hours'), id('sensor', 'plays'));

      const measuredNames = [id('sensor', 'measured_remote_upload')];
      const capNames = [id('sensor', 'configured_upload_limit')];
      const measured = num(...measuredNames);
      const cap = num(...capNames);
      const upUnit = attr(measuredNames, 'unit_of_measurement', 'Mbit/s');
      const capUnit = attr(capNames, 'unit_of_measurement', upUnit);
      const upload = measured === null ? '—' : measured.toFixed(1);
      const capText = cap === null ? '—' : cap === 0 ? '∞' : cap.toFixed(0);

      const serviceUp = fmtDuration(id('sensor', 'service_uptime'));
      const hostUp = fmtDuration(id('sensor', 'host_uptime'));

      const memUsage = num(id('sensor', 'memory_usage'));
      const memTotal = num(id('sensor', 'memory_total'));
      const memFree = num(id('sensor', 'memory_available'));
      const memPct = memUsage !== null ? Math.round(memUsage)
        : (memTotal !== null && memFree !== null && memTotal > 0)
          ? Math.round((1 - memFree / memTotal) * 100) : null;

      /* Disks are named after the server's label, so find the first matching sensor. */
      const diskStart = id('sensor', '');
      const diskKeys = Object.keys(S || {}).filter(key => key.startsWith(diskStart) && key.endsWith('_available_space'));
      const diskKey = diskKeys.find(key => key.toLowerCase().includes('media')) || diskKeys[0] || null;
      const diskFree = diskKey === null ? '—' : fmtSize(diskKey);

      const pct = online && measured !== null && cap !== null && cap > 0
        ? Math.min(100, Math.max(0, (measured / cap) * 100)) : null;
      const meterWidth = pct === null ? 100 : pct;
      const meterColor = online && pct !== null ? 'linear-gradient(90deg,#8fbf5a,#c7ed89)' : 'rgba(166,175,161,.28)';
      const meterLabel = maint ? 'Maintenance mode — playback blocked'
        : !online ? 'Telemetry paused'
        : pct === null ? 'No upload cap configured'
        : `${pct.toFixed(0)}% of ${cap.toFixed(0)} ${esc(capUnit)} cap`;

      const label = 'font-family:var(--ha-font-family-body,sans-serif);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#8d9789';
      const value = 'display:block;font-family:var(--ha-font-family-body,sans-serif);font-size:28px;font-weight:650;letter-spacing:-.03em;line-height:1;color:#f2f6ec;font-variant-numeric:tabular-nums';
      const small = 'display:block;font-family:var(--ha-font-family-body,sans-serif);font-size:18px;font-weight:650;line-height:1;color:#f2f6ec;font-variant-numeric:tabular-nums';
      const cell = 'flex:1 1 64px;min-width:64px';
      const foot = 'font-family:var(--ha-font-family-body,sans-serif);font-size:10px;letter-spacing:.04em;color:#9aa596;font-variant-numeric:tabular-nums';

      return `
        <div style="padding:20px 22px;border:1px solid ${maint ? 'rgba(242,193,78,.28)' : 'rgba(199,237,137,.16)'};border-radius:22px;background:radial-gradient(700px 220px at 0% 0%,${maint ? 'rgba(242,193,78,.10)' : 'rgba(199,237,137,.12)'},transparent 60%),linear-gradient(160deg,#171c16,#0e120e);box-shadow:0 16px 40px rgba(0,0,0,.32);text-align:left">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
            <img src="${esc(logo)}" alt="Tellybox" style="display:block;height:36px;width:auto;max-width:170px;object-fit:contain" />
            <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;border:1px solid ${statusBorder};background:${statusBg};color:${statusColor};font-family:var(--ha-font-family-body,sans-serif);font-size:9px;font-weight:700;letter-spacing:.14em;white-space:nowrap">
              <span style="display:block;width:5px;height:5px;border-radius:50%;background:${statusColor}"></span>${status}
            </span>
          </div>

          <div style="margin-top:13px;${label}">TELLYBOX SERVER · UP ${serviceUp}</div>

          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:15px">
            <div style="${cell}"><b style="${value}">${active}</b><span style="${label}">Watching</span></div>
            <div style="${cell}"><b style="${value}">${viewers}</b><span style="${label}">Viewers</span></div>
            <div style="${cell}"><b style="${value}">${paused}</b><span style="${label}">Paused</span></div>
          </div>

          <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:14px">
            <div style="${cell}"><b style="${value}">${upload}</b><span style="${label}">${esc(upUnit)} up</span></div>
            <div style="${cell}"><b style="${value}">${capText}</b><span style="${label}">${esc(capUnit)} cap</span></div>
            <div style="${cell}"><b style="${value}">${downloads}</b><span style="${label}">Downloads</span></div>
          </div>

          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)">
            <div style="${cell}"><b style="${small}">${connected}</b><span style="${label}">Connected</span></div>
            <div style="${cell}"><b style="${small}">${local}</b><span style="${label}">Local</span></div>
            <div style="${cell}"><b style="${small}">${remote}</b><span style="${label}">Remote</span></div>
          </div>

          <div style="margin-top:15px">
            <div style="height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden">
              <div style="width:${meterWidth}%;height:100%;border-radius:99px;background:${meterColor}"></div>
            </div>
            <div style="margin-top:7px;${label};letter-spacing:.10em">${meterLabel}</div>
          </div>

          <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05);display:flex;flex-wrap:wrap;gap:6px 14px;${foot}">
            <span>Host up ${hostUp}</span>
            <span>Memory ${memPct === null ? '—' : memPct + '%'}</span>
            <span>Disk ${diskFree} free</span>
            ${plays !== '—' ? `<span>${plays} plays · 24h</span>` : ''}
          </div>
        </div>
      `;
    ]]]
styles:
  card:
    - padding: 0
    - margin: 0
    - background: transparent
    - border: none
    - border-radius: 0
    - box-shadow: none
    - overflow: visible
  grid:
    - grid-template-areas: '"panel"'
    - grid-template-columns: 1fr
  custom_fields:
    panel:
      - width: 100%
      - justify-self: stretch
